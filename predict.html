<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict - Student Performance</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-graduation-cap"></i>
                EduPredict
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="predict.html" class="active">Predict</a></li>
                <li><a href="analytics.html">Analytics</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button class="mobile-menu-btn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </nav>

    <main class="main-content container">
        <div class="card" style="max-width: 900px; margin: 0 auto;">
            <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">Enter Student Details</h2>
            
            <form id="predictForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="studentName">1. Student Name</label>
                        <input type="text" id="studentName" class="form-control" placeholder="Enter full name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="age">2. Age</label>
                        <input type="number" id="age" class="form-control" min="10" max="100" placeholder="e.g., 20" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="gender">3. Gender</label>
                        <select id="gender" class="form-control" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="grade">4. Grade / Year</label>
                        <select id="grade" class="form-control" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="studyHours">5. Study Hours per Day</label>
                        <input type="number" id="studyHours" class="form-control" min="0" max="24" step="0.5" placeholder="e.g., 4" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="attendance">6. Attendance Percentage (%)</label>
                        <input type="number" id="attendance" class="form-control" min="0" max="100" placeholder="e.g., 85" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="prevScore">7. Previous Exam Score (%)</label>
                        <input type="number" id="prevScore" class="form-control" min="0" max="100" placeholder="e.g., 78" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="assignment">8. Assignment Score (%)</label>
                        <input type="number" id="assignment" class="form-control" min="0" max="100" placeholder="e.g., 90" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="internal">9. Internal Marks (%)</label>
                        <input type="number" id="internal" class="form-control" min="0" max="100" placeholder="e.g., 82" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="backlogs">10. Number of Backlogs</label>
                        <input type="number" id="backlogs" class="form-control" min="0" value="0" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="sleepHours">11. Sleep Hours per Day</label>
                        <input type="number" id="sleepHours" class="form-control" min="0" max="24" placeholder="e.g., 7" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="activities">12. Participation in Activities</label>
                        <select id="activities" class="form-control" required>
                            <option value="">Select Participation</option>
                            <option value="none">None</option>
                            <option value="low">Low (1-2 clubs)</option>
                            <option value="high">High (Active/Leadership)</option>
                        </select>
                    </div>
                </div>

                <div style="text-align: center; margin-top: 2rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; max-width: 300px; font-size: 1.1rem;">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> Predict Performance
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 EduPredict - Student Performance Prediction. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
